#paper-intro-drawing{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
#paper-house-title{left:50%;top:50%;width:85vw;max-width:1100px;text-align:center;transform:translate(-50%,-50%);transition:none!important;font:300 clamp(12px,1.1vw,16px)/1.6 MonumentMono,monospace;letter-spacing:.06em}
#paper-house-title,#paper-house-title *{color:var(--casa-text-dark)!important;text-shadow:none!important;box-shadow:none!important;--ink-shadow:none!important}
#paper-box-question{left:50%;top:20vh;width:min(900px,92vw);max-width:none;height:clamp(185px,30vh,290px);transform:translateX(-50%);font-family:Georgia,serif;font-weight:400;font-size:clamp(26px,3.5vw,52px);line-height:1.12;color:#335386;text-shadow:0 1px 12px #fff,0 0 3px #f4f4f1;transition:none;visibility:hidden}
.box-question-word{position:absolute;white-space:nowrap;letter-spacing:var(--word-spacing)}
#paper-box-question .ink-letter:nth-child(3n){position:relative;top:.025em;margin-right:-.025em}
#paper-box-question .ink-letter:nth-child(4n){position:relative;top:-.02em;margin-left:.035em}
#paper-box-question .box-question-normal .ink-letter{top:0;margin-left:0;margin-right:0}
body.hint-visible:not(.inhabited) #approach-hint{display:block!important;background:transparent;color:#153f6f;padding:0;letter-spacing:1px;font:11px/1.4 monospace;bottom:auto;z-index:20;text-align:center;animation:entry-hint-pulse 2.8s ease-in-out infinite}
#casa-layers #caja{display:none!important;pointer-events:none!important}
@keyframes entry-hint-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){body.hint-visible:not(.inhabited) #approach-hint{animation:none}}
body.paper-intro-drawing{user-select:none}
