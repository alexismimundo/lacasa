<!doctype html><html><body><script>
// Clear only detached neighbour fragments. Keep canvas size and object placement.
const masks={6:[0,204],7:[0,216],11:[0,168],18:[6,999],21:[0,162],22:[15,147]};
Promise.all(Object.entries(masks).flatMap(([id,[top,bottom]])=>['azul','negro'].map(color=>new Promise((resolve,reject)=>{
 const name='objeto-'+String(id).padStart(2,'0')+'-'+color+'.webp';
 const image=new Image();image.onerror=()=>reject(Error(name));
 image.onload=()=>{
  const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
  const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);
  ctx.clearRect(0,0,canvas.width,top);ctx.clearRect(0,bottom+1,canvas.width,canvas.height);
  const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let residual=0;
  for(let y=0;y<canvas.height;y++)if(y<top||y>bottom)for(let x=0;x<canvas.width;x++)residual+=data[(y*canvas.width+x)*4+3]>0?1:0;
  resolve({name,width:canvas.width,height:canvas.height,residual,data:canvas.toDataURL('image/webp',1)});
 };
 image.src='../dist/assets/objetos-incendio/recortes/'+name;
})))).then(results=>{const p=document.createElement('pre');p.id='cleaned';p.textContent=JSON.stringify(results);document.body.append(p)}).catch(error=>document.body.textContent=error.stack);
</script></body></html>
