<!doctype html><script>window.ready=(async()=>{const out=[];for(const n of [1,2,13,27,28]){const im=new Image();im.src='../dist/assets/casas-comunidad/recortes/casa-'+String(n).padStart(2,'0')+'.png';await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let transparent=0,white=0,solid=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<20)transparent++;else {solid++;if(d[i]>220)white++}}out.push({n,w:c.width,h:c.height,transparent,white,solid,corners:[...d.slice(0,4)]});}return JSON.stringify(out)})();</script>
