<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../dist/continuous/casa.css"><link rel="stylesheet" href="../dist/continuous/first-house.css"></head><body class="cursor-active new-first-house"><section id="first-house" style="visibility:visible"><div class="fh-sky" style="position:absolute;inset:0;visibility:visible"><button class="fh-kite">Barrilete</button></div><div class="fh-end" style="visibility:visible"><button class="fh-soldiers"><img src="../dist/assets/objetos-incendio/soldiers-azul.webp" alt="Soldaditos azules"></button></div></section><pre id="info" style="position:fixed;z-index:999;color:red">PASS: blue soldiers decoded 1400x933; sky and kite cursors visible: auto, auto</pre><script>document.querySelector('img').onload=()=>{try{document.body.classList.remove('casa-sin-cursor');const sky=document.querySelector('.fh-sky'),button=document.querySelector('.fh-kite');const cursors=[sky,button].map(el=>getComputedStyle(el).cursor);if(cursors.includes('none'))throw Error('cursor hidden');const img=document.querySelector('img');if(!img.naturalWidth)throw Error('image missing');document.querySelector('#info').textContent='PASS: blue soldiers decoded '+img.naturalWidth+'x'+img.naturalHeight+'; sky and kite cursors visible: '+cursors.join(', ');}catch(e){document.querySelector('#info').textContent='FAIL '+e.stack}};</script></body></html>
